# ============================================================================
# Experiment configuration for experiments/run_benchmark.py
#
# A run is one (dataset, model, method, seed[, k]) combination. `defaults`
# apply to every benchmark; a benchmark block overrides them; command-line
# flags override both. Method hyper-parameters live under `methods:` and can
# be overridden per benchmark with `method_params: {method: {...}}`.
# ============================================================================

defaults:
  seeds: [42]
  k: 5
  num_train: 1000        # demonstration pool size (sampled from train)
  num_val: 200           # validation examples (only used by `influence`)
  num_test: 200
  prediction_mode: auto  # score (label log-probs) when the backend allows, else generate
  embedding_model: all-MiniLM-L6-v2
  scorer_model: gpt2     # LM used by topk_cone / se2 for scoring; "self" = the evaluated model
  max_new_tokens: 10
  output_dir: results/raw

methods:
  random: {}
  topk: {}
  bm25: {}
  topk_cone:
    retrieve_k: 30
  ids:
    k: 4
    q: 3
  rdes:
    alpha: 0.1
    gamma: 0.9
    epsilon: 0.2
    relevance_weight: 0.5
  se2:
    k: 3
    retrieve_k: 20
    beam_size: 3
  influence:
    num_subsets: 100
    coverage: 1
    estimator: difference

benchmarks:
  # Runs in seconds with no GPU, network or API key. Used by CI.
  smoke:
    datasets: [sst5]
    models: [dummy]
    methods: [random, topk, bm25, topk_cone, ids, rdes, se2, influence]
    num_train: 40
    num_val: 8
    num_test: 12
    seeds: [0]
    scorer_model: self
    method_params:
      influence: {num_subsets: 12}
      se2: {retrieve_k: 8, beam_size: 2}

  # Small real run on a local GPT-2: sanity-check the pipeline end to end.
  quick_test:
    datasets: [sst5]
    models: [gpt2]
    methods: [random, topk, bm25, topk_cone]
    num_train: 500
    num_test: 100
    seeds: [0]
    scorer_model: self

  full_benchmark:
    datasets: [sst5, agnews, csqa]
    models: [gpt-4o-mini, llama-3.2-3b, gemma-2b]
    methods: [random, topk, bm25, topk_cone, ids, rdes, se2, influence]
    num_train: 2000
    num_val: 200
    num_test: 500
    seeds: [0, 1, 2]

  ablation_k:
    datasets: [sst5]
    models: [llama-3.2-3b]
    methods: [random, topk, topk_cone, se2]
    k_values: [1, 3, 5, 8]
    num_train: 2000
    num_test: 300
    seeds: [0, 1, 2]
