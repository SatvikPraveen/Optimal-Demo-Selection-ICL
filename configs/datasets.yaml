# ============================================================================
# Dataset metadata (informational).
#
# Prompt templates, label verbalizers and split handling are defined in
# src/datasets/tasks.py (the Task registry); this file documents the upstream
# sources and typical sizes used by the benchmarks in experiments.yaml.
# ============================================================================

datasets:
  sst5:
    source: "SetFit/sst5"
    task_type: sentiment_classification
    num_classes: 5
    label_names: [very negative, negative, neutral, positive, very positive]
    upstream_splits: {train: train, validation: validation, test: test}
    sizes: {train: 8544, validation: 1101, test: 2210}

  agnews:
    source: "wangrongsheng/ag_news (parquet mirror of ag_news)"
    task_type: topic_classification
    num_classes: 4
    label_names: [World, Sports, Business, Technology]
    upstream_splits: {train: train, test: test}
    validation: "carved from the tail of a seeded shuffle of train (10%)"
    sizes: {train: 120000, test: 7600}

  csqa:
    source: "tau/commonsense_qa"
    task_type: multiple_choice_qa
    num_classes: 5
    label_names: [A, B, C, D, E]
    upstream_splits: {train: train, validation: validation}
    test: "the labeled validation split (the official test split is unlabeled)"
    validation: "carved from the tail of a seeded shuffle of train (10%)"
    sizes: {train: 9741, validation: 1221}
