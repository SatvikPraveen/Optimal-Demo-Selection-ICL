# ============================================================================
# Model registry for experiments/run_benchmark.py (see src/models/registry.py)
#
# type: openai | huggingface | dummy
# kwargs: forwarded to the backend constructor
# ============================================================================

models:
  dummy:
    type: dummy
    model_name: dummy
    notes: deterministic stand-in used by the smoke benchmark and CI

  gpt2:
    type: huggingface
    model_name: gpt2
    max_context: 1024

  gpt2-medium:
    type: huggingface
    model_name: gpt2-medium
    max_context: 1024

  gpt-neo-1.3b:
    type: huggingface
    model_name: EleutherAI/gpt-neo-1.3B
    max_context: 2048
    kwargs: {torch_dtype: float16}

  llama-3.2-3b:
    type: huggingface
    model_name: meta-llama/Llama-3.2-3B-Instruct
    max_context: 131072
    requires_auth: true
    kwargs: {torch_dtype: bfloat16}

  gemma-2b:
    type: huggingface
    model_name: google/gemma-2b
    max_context: 8192
    requires_auth: true
    kwargs: {torch_dtype: bfloat16}

  gpt-4o-mini:
    type: openai
    model_name: gpt-4o-mini
    max_context: 128000
    cost_per_1k_input: 0.00015
    cost_per_1k_output: 0.0006

  gpt-3.5-turbo:
    type: openai
    model_name: gpt-3.5-turbo
    max_context: 16385
    cost_per_1k_input: 0.0005
    cost_per_1k_output: 0.0015
